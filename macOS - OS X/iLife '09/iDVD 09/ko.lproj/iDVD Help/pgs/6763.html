하여 기존 재생목록을 대치해야 합니다.</p></div><!--closes introprimtext--></div> <!--closes introbox --><div id="linkinternalbox"><h3>관련 주제</h3><p class="linkinternal"><a href="help:anchor='idvd1105' bookID='iDVD 도움말'">메뉴에 사운드 추가하기 <span class="linkarrow"></span></a></p><p class="linkinternal"><a href="help:anchor='idvd1062' bookID='iDVD 도움말'">슬라이드쇼에 사운드 추가하기 <span class="linkarrow"></span></a></p></div><!--closes linkinternalbox--><!--<div id="linkfeedbackbox"><span class="linkfeedback">Was this page helpful? <a href="http://help.apple.com/feedbackR1/English/pgs/fdbck_form.php?bookID=iDVD%20Help&topicTitle=Changing%20the%20order%20of%20songs%20in%20a%20iTunes%20playlist&version=10">Send feedback.</a></span></div>--><!--closes linkfeedbackbox--></body></html>
