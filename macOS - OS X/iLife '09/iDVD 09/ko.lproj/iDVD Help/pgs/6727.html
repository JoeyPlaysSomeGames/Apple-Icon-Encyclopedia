 됩니다.</p></div><!--closes introprimtext--></div> <!--closes introbox --><div id="taskbox"><!--taskbox border top row--><div class="border_top"><div class="border_topleft"></div><div class="border_topright"></div></div><!--closes taskbox border top row--><!--taskbox border left--><div class="border_left"><!--taskbox border right--><div class="border_right"><!--taskbox content--><div class="content"><h2>경고 메시지를 켜려면,</h2><div class="taskprimtext"><div class="taskprimbullet"><img src="../gfx/step_1.gif" alt="1단계" class="bullet1"/></div><div class="taskprimcontent"><p class="taskprimtextlongtext">iDVD > 환경설정을 선택하십시오.</p></div><!--closes taskprimcontent--></div><!-- closes taskprimtext --><div class="taskprimtext"><div class="taskprimbullet"><img src="../gfx/step_2.gif" alt="2단계" class="bullet2"/></div><div class="taskprimcontent"><p class="taskprimtextlongtext">일반을 클릭하십시오.</p></div><!--closes taskprimcontent--></div><!-- closes taskprimtext --><div class="taskprimtext"><div class="taskprimbullet"><img src="../gfx/step_3.gif" alt="3단계" class="bullet3"/></div><div class="taskprimcontent"><p class="taskprimtextlongtext">대화상자의 하단에 있는 경고 재설정 단추를 클릭하십시오.</p></div><!--closes taskprimcontent--></div><!-- closes taskprimtext --></div><!--closes taskbox content--></div><!--closes taskbox border right--></div><!--closes taskbox border left--><!--taskbox border bottom row--><div class="border_bottom"><div class="border_bottomleft"></div><div class="border_bottomright"></div></div><!--closes taskbox border bottom row--></div><!--closes taskbox --><!--<div id="linkfeedbackbox"><span class="linkfeedback">Was this page helpful? <a href="http://help.apple.com/feedbackR1/English/pgs/fdbck_form.php?bookID=iDVD%20Help&topicTitle=Resetting%20iDVD%20warning%20messages&version=10">Send feedback.</a></span></div>--><!--closes linkfeedbackbox--></body></html>
