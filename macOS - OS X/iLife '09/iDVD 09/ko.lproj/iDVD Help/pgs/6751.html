der_top"><div class="border_topleft"></div><div class="border_topright"></div></div><!--closes taskbox border top row--><!--taskbox border left--><div class="border_left"><!--taskbox border right--><div class="border_right"><!--taskbox content--><div class="content"><h2>와이드스크린 프로젝트를 작은 컴퓨터 화면에 맞추려면,</h2><div class="taskprimtext"><div class="taskprimbullet"></div><div class="taskprimcontent"><p class="taskprimtextlongtext">윈도우 > "화면에 맞추기"를 선택하십시오.</p></div><!--closes taskprimcontent--></div><!-- closes taskprimtext --></div><!--closes taskbox content--></div><!--closes taskbox border right--></div><!--closes taskbox border left--><!--taskbox border bottom row--><div class="border_bottom"><div class="border_bottomleft"></div><div class="border_bottomright"></div></div><!--closes taskbox border bottom row--></div><!--closes taskbox --><div id="outrobox"><div class="outroprimtext"><p class="outroprimtextlongtext">일반 보기로 되돌아가려면, 윈도우 > 실제 크기를 선택하십시오.</p></div><!--closes outroprimtext--></div><!--closes outrobox --><div id="linkinternalbox"><h3>관련 주제</h3><p class="linkinternal"><a href="help:anchor='idvd1275' bookID='iDVD 도움말'">표준과 와이드스크린 포맷 사이 전환하기 <span class="linkarrow"></span></a></p><p class="linkinternal"><a href="help:anchor='idvd1241' bookID='iDVD 도움말'">iDVD 윈도우 크기 변경하기 <span class="linkarrow"></span></a></p></div><!--closes linkinternalbox--><!--<div id="linkfeedbackbox"><span class="linkfeedback">Was this page helpful? <a href="http://help.apple.com/feedbackR1/English/pgs/fdbck_form.php?bookID=iDVD%20Help&topicTitle=If%20your%20computer%20screen%20is%20too%20small%20for%20widescreen%20projects&version=10">Send feedback.</a></span></div>--><!--closes linkfeedbackbox--></body></html>
