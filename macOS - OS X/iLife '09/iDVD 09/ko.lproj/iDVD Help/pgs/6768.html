p></div><!--closes introprimtext--></div> <!--closes introbox --><div id="linkinternalbox"><h3>관련 주제</h3><p class="linkinternal"><a href="help:anchor='idvd1019' bookID='iDVD 도움말'">iDVD에서 슬라이드쇼 생성하기 <span class="linkarrow"></span></a></p><p class="linkinternal"><a href="help:anchor='idvd1042' bookID='iDVD 도움말'">iDVD 슬라이드쇼용 이미지 준비하기 <span class="linkarrow"></span></a></p><p class="linkinternal"><a href="help:anchor='idvd1074' bookID='iDVD 도움말'">파일을 디스크의 DVD-ROM 부분에 추가하기 <span class="linkarrow"></span></a></p></div><!--closes linkinternalbox--><!--<div id="linkfeedbackbox"><span class="linkfeedback">Was this page helpful? <a href="http://help.apple.com/feedbackR1/English/pgs/fdbck_form.php?bookID=iDVD%20Help&topicTitle=About%20adding%20RAW%20images%20to%20a%20slideshow&version=10">Send feedback.</a></span></div>--><!--closes linkfeedbackbox--></body></html>
