ox"><a class="navlink_right" href="help:anchor='xall' bookID=iDVD 도움말">인덱스</a></div></div><!--closes top navigation area--><!--page head--><div id="headerbox"><div id="iconbox"><img id="iconimg" src="../gfx/xicnidvd.gif" alt="iDVD 아이콘" height="32" width="32"/></div><div id="pagetitle"><h1>DVD 이름 짓기</h1></div></div><!--closes page header--><div id="introbox"><div class="introprimtext"><p class="introprimtextlongtext">기본적으로 DVD 디스크의 이름은 구운 iDVD 프로젝트의 이름과 동일합니다. 디스크 이름을 쉽게 변경할 수 있습니다.</p></div><!--closes introprimtext--></div> <!--closes introbox --><div id="taskbox"><!--taskbox border top row--><div class="border_top"><div class="border_topleft"></div><div class="border_topright"></div></div><!--closes taskbox border top row--><!--taskbox border left--><div class="border_left"><!--taskbox border right--><div class="border_right"><!--taskbox content--><div class="content"><h2>DVD 디스크의 이름을 지으려면,</h2><div class="taskprimtext"><div class="taskprimbullet"><img src="../gfx/step_1.gif" alt="1단계" class="bullet1"/></div><div class="taskprimcontent"><p class="taskprimtextlongtext">프로젝트 > 프로젝트 정보를 선택하십시오.</p></div><!--closes taskprimcontent--></div><!-- closes taskprimtext --><div class="taskprimtext"><div class="taskprimbullet"><img src="../gfx/step_2.gif" alt="2단계" class="bullet2"/></div><div class="taskprimcontent"><p class="taskprimtextlongtext">디스크 이름 필드에 새로운 이름을 입력하십시오.</p></div><!--closes taskprimcontent--></div><!-- closes taskprimtext --></div><!--closes taskbox content--></div><!--closes taskbox border right--></div><!--closes taskbox border left--><!--taskbox border bottom row--><div class="border_bottom"><div class="border_bottomleft"></div><div class="border_bottomright"></div></div><!--closes taskbox border bottom row--></div><!--closes taskbox --><div id="outrobox"><div class="outroprimtext"><p class="outroprimtextlongtext">DVD 이름에 사용할 수 있는 문자는 0에서 9까지의 숫자와 A부터 Z까지의 대소문자 및 공백용 밑줄(_)입니다. 소문자는 대문자로 저장됩니다.</p></div><!--closes outroprimtext--></div><!--closes outrobox --><div id="linkinternalbox"><h3>관련 주제</h3><p class="linkinternal"><a href="help:anchor='idvd1053' bookID='iDVD 도움말'">DVD 이름에 특수 문자 사용하기에 관하여 <span class="linkarrow"></span></a></p></div><!--closes linkinternalbox--><!--<div id="linkfeedbackbox"><span class="linkfeedback">Was this page helpful? <a href="http://help.apple.com/feedbackR1/English/pgs/fdbck_form.php?bookID=iDVD%20Help&topicTitle=Naming%20a%20DVD&version=10">Send feedback.</a></span></div>--><!--closes linkfeedbackbox--></body></html>
